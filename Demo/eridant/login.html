<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in · Eridant Evidence Intelligence</title>
  <style>
    :root {
      --paper: #f6f1e7;
      --ink: #1b2a47;
      --ink-deep: #12203b;
      --brass: #b08d3e;
      --brass-dark: #8a6d2f;
      --grey: #5b6472;
      --red: #8e2f1f;
      --line: #d8cfbb;
      --serif: Georgia, "Times New Roman", serif;
      --sans: system-ui, -apple-system, "Segoe UI", sans-serif;
      --mono: ui-monospace, Menlo, Consolas, monospace;
    }
    * { box-sizing: border-box; }
    html, body { min-height: 100%; margin: 0; }
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 28px;
      color: var(--ink);
      font-family: var(--sans);
      background:
        radial-gradient(1100px 620px at 70% -10%, #24365b 0%, #1b2a47 52%, #141f35 100%);
    }
    .shell { width: min(440px, 100%); }
    .card {
      padding: 38px 38px 32px;
      border: 1px solid rgba(176, 141, 62, .42);
      border-radius: 15px;
      background: var(--paper);
      box-shadow: 0 34px 90px rgba(0, 0, 0, .5);
    }
    .brand { display: flex; align-items: baseline; gap: 10px; margin-bottom: 28px; }
    .mark { font: 700 23px var(--serif); letter-spacing: .07em; }
    .mark em { color: var(--brass); font-style: normal; }
    .tag {
      color: var(--grey);
      font: 9px var(--mono);
      letter-spacing: .16em;
      text-transform: uppercase;
    }
    h1 { margin: 0 0 7px; font: 600 26px/1.2 var(--serif); }
    .sub {
      margin: 0 0 26px;
      color: var(--brass-dark);
      font: 9.5px/1.5 var(--mono);
      letter-spacing: .1em;
      text-transform: uppercase;
    }
    label {
      display: block;
      margin: 14px 0 6px;
      color: var(--grey);
      font: 9.5px var(--mono);
      letter-spacing: .09em;
      text-transform: uppercase;
    }
    input {
      width: 100%;
      padding: 12px 13px;
      border: 1px solid var(--line);
      border-radius: 7px;
      background: #fff;
      color: var(--ink);
      font: 14px var(--sans);
    }
    input:focus {
      outline: 0;
      border-color: var(--brass-dark);
      box-shadow: 0 0 0 3px rgba(176, 141, 62, .16);
    }
    button {
      width: 100%;
      margin-top: 20px;
      padding: 12px 18px;
      border: 1px solid var(--brass);
      border-radius: 8px;
      color: #fff;
      background: var(--brass);
      font: 600 14px var(--sans);
      cursor: pointer;
    }
    button:hover { background: var(--brass-dark); border-color: var(--brass-dark); }
    button:disabled { cursor: wait; opacity: .65; }
    .error {
      display: none;
      margin-top: 13px;
      padding: 9px 11px;
      border-left: 3px solid var(--red);
      color: var(--red);
      background: rgba(142, 47, 31, .07);
      font-size: 12px;
      line-height: 1.45;
    }
    .note {
      margin-top: 22px;
      padding-top: 16px;
      border-top: 1px solid var(--line);
      color: var(--grey);
      font: 9px/1.6 var(--mono);
      letter-spacing: .05em;
      text-align: center;
      text-transform: uppercase;
    }
    .alternate {
      margin-top: 15px;
      color: var(--grey);
      font-size: 12px;
      text-align: center;
    }
    .alternate a { color: var(--brass-dark); font-weight: 650; text-decoration: none; }
    .alternate a:hover { text-decoration: underline; }
    .build {
      margin-top: 15px;
      color: rgba(246, 241, 231, .48);
      font: 9px var(--mono);
      letter-spacing: .12em;
      text-align: center;
      text-transform: uppercase;
    }
    @media (max-width: 520px) {
      body { padding: 16px; }
      .card { padding: 30px 24px 26px; }
      .tag { display: none; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <section class="card" aria-labelledby="login-heading">
      <div class="brand">
        <span class="mark">ERIDANT<em>◆</em></span>
        <span class="tag">Evidence Intelligence</span>
      </div>
      <h1 id="login-heading">Sign in to the underwriting workspace</h1>
      <p class="sub">Golden State Commerce Bank · Credit Administration</p>

      <form id="login-form">
        <label for="email">Work email</label>
        <input id="email" name="email" type="email" autocomplete="username" required autofocus>

        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>

        <div class="error" id="login-error" role="alert" aria-live="polite"></div>
        <button id="login-button" type="submit">Log in →</button>
      </form>

      <div class="note">Accounts require an administrator-issued invitation · Sessions expire after inactivity</div>
      <div class="alternate">Have an invitation? <a href="/signup">Sign up</a></div>
    </section>
    <div class="build">Authenticated application · Server-side session control</div>
  </main>

  <script>
    const form = document.querySelector("#login-form");
    const button = document.querySelector("#login-button");
    const errorBox = document.querySelector("#login-error");

    function showError(message) {
      errorBox.textContent = message;
      errorBox.style.display = "block";
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      if (!form.reportValidity()) return;

      errorBox.style.display = "none";
      button.disabled = true;
      button.textContent = "Logging in…";
      try {
        const response = await fetch("/api/auth/login", {
          method: "POST",
          credentials: "same-origin",
          cache: "no-store",
          headers: {"Accept": "application/json", "Content-Type": "application/json"},
          body: JSON.stringify({
            email: document.querySelector("#email").value.trim(),
            password: document.querySelector("#password").value
          })
        });

        if (response.ok) {
          try { sessionStorage.setItem("eridant-fresh-upload", "1"); sessionStorage.removeItem("eridant-analysis-open"); sessionStorage.removeItem("eridant-view"); } catch (_) {}
          try {
            await new Promise((resolve) => {
              const req = indexedDB.deleteDatabase("eridant-packet");
              req.onsuccess = () => resolve();
              req.onerror = () => resolve();
              req.onblocked = () => resolve();
            });
          } catch (_) {}
          window.location.replace("/");
          return;
        }
        if (response.status === 429) {
          showError("Too many sign-in attempts. Please wait and try again.");
        } else if (response.status === 403) {
          showError("This sign-in request was blocked. Reload the page from the HTTPS site address and try again.");
        } else if (response.status === 401) {
          showError("The email or password is incorrect.");
        } else {
          showError("Sign-in failed. Please try again.");
        }
        document.querySelector("#password").value = "";
        document.querySelector("#password").focus();
      } catch (_) {
        showError("Sign-in is temporarily unavailable. Please try again.");
      } finally {
        button.disabled = false;
        button.textContent = "Log in →";
      }
    });
  </script>
</body>
</html>
