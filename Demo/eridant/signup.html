<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Create account · Eridant Evidence Intelligence</title>
  <style>
    :root {
      --paper: #f6f1e7;
      --ink: #1b2a47;
      --brass: #b08d3e;
      --brass-dark: #8a6d2f;
      --grey: #5b6472;
      --red: #8e2f1f;
      --line: #d8cfbb;
      --serif: Georgia, "Times New Roman", serif;
      --sans: system-ui, -apple-system, "Segoe UI", sans-serif;
      --mono: ui-monospace, Menlo, Consolas, monospace;
    }
    * { box-sizing: border-box; }
    html, body { min-height: 100%; margin: 0; }
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 28px;
      color: var(--ink);
      font-family: var(--sans);
      background:
        radial-gradient(1100px 620px at 70% -10%, #24365b 0%, #1b2a47 52%, #141f35 100%);
    }
    .shell { width: min(470px, 100%); }
    .card {
      padding: 36px 38px 30px;
      border: 1px solid rgba(176, 141, 62, .42);
      border-radius: 15px;
      background: var(--paper);
      box-shadow: 0 34px 90px rgba(0, 0, 0, .5);
    }
    .brand { display: flex; align-items: baseline; gap: 10px; margin-bottom: 24px; }
    .mark { font: 700 23px var(--serif); letter-spacing: .07em; }
    .mark em { color: var(--brass); font-style: normal; }
    .tag {
      color: var(--grey);
      font: 9px var(--mono);
      letter-spacing: .16em;
      text-transform: uppercase;
    }
    h1 { margin: 0 0 7px; font: 600 26px/1.2 var(--serif); }
    .sub {
      margin: 0 0 20px;
      color: var(--brass-dark);
      font: 9.5px/1.5 var(--mono);
      letter-spacing: .1em;
      text-transform: uppercase;
    }
    label {
      display: block;
      margin: 13px 0 6px;
      color: var(--grey);
      font: 9.5px var(--mono);
      letter-spacing: .09em;
      text-transform: uppercase;
    }
    input {
      width: 100%;
      padding: 11px 13px;
      border: 1px solid var(--line);
      border-radius: 7px;
      background: #fff;
      color: var(--ink);
      font: 14px var(--sans);
    }
    input[readonly] { color: var(--grey); background: #eee9df; }
    input:focus {
      outline: 0;
      border-color: var(--brass-dark);
      box-shadow: 0 0 0 3px rgba(176, 141, 62, .16);
    }
    .hint { margin: 6px 0 0; color: var(--grey); font-size: 11px; line-height: 1.45; }
    button {
      width: 100%;
      margin-top: 19px;
      padding: 12px 18px;
      border: 1px solid var(--brass);
      border-radius: 8px;
      color: #fff;
      background: var(--brass);
      font: 600 14px var(--sans);
      cursor: pointer;
    }
    button:hover { background: var(--brass-dark); border-color: var(--brass-dark); }
    button:disabled { cursor: wait; opacity: .55; }
    .message {
      display: none;
      margin: 0 0 14px;
      padding: 10px 12px;
      border-left: 3px solid var(--red);
      color: var(--red);
      background: rgba(142, 47, 31, .07);
      font-size: 12px;
      line-height: 1.45;
    }
    .alternate {
      margin-top: 18px;
      padding-top: 15px;
      border-top: 1px solid var(--line);
      color: var(--grey);
      font-size: 12px;
      text-align: center;
    }
    .alternate a { color: var(--brass-dark); font-weight: 650; text-decoration: none; }
    .alternate a:hover { text-decoration: underline; }
    .build {
      margin-top: 15px;
      color: rgba(246, 241, 231, .48);
      font: 9px var(--mono);
      letter-spacing: .12em;
      text-align: center;
      text-transform: uppercase;
    }
    @media (max-width: 520px) {
      body { padding: 16px; }
      .card { padding: 29px 24px 25px; }
      .tag { display: none; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <section class="card" aria-labelledby="signup-heading">
      <div class="brand">
        <span class="mark">ERIDANT<em>◆</em></span>
        <span class="tag">Evidence Intelligence</span>
      </div>
      <h1 id="signup-heading">Create your account</h1>
      <p class="sub">Invitation required · Credit Administration</p>
      <div class="message" id="signup-message" role="alert" aria-live="polite"></div>

      <form id="signup-form">
        <label for="display-name">Full name</label>
        <input id="display-name" name="displayName" autocomplete="name" maxlength="120" required autofocus>

        <label for="email">Work email</label>
        <input id="email" name="email" type="email" autocomplete="username" readonly required>

        <label for="password">Create password</label>
        <input id="password" name="password" type="password" autocomplete="new-password" minlength="12" maxlength="1024" required>
        <p class="hint">Use at least 12 characters. A password manager-generated password is recommended.</p>

        <label for="password-confirm">Confirm password</label>
        <input id="password-confirm" name="passwordConfirm" type="password" autocomplete="new-password" minlength="12" maxlength="1024" required>

        <button id="signup-button" type="submit" disabled>Create account →</button>
      </form>

      <div class="alternate">Already have an account? <a href="/login">Log in</a></div>
    </section>
    <div class="build">One-time invitation · Server-side account creation</div>
  </main>

  <script>
    const form = document.querySelector("#signup-form");
    const button = document.querySelector("#signup-button");
    const messageBox = document.querySelector("#signup-message");
    const emailInput = document.querySelector("#email");
    const hash = new URLSearchParams(window.location.hash.slice(1));
    const inviteToken = hash.get("invite") || "";

    // Remove the invitation credential from the visible URL and browser history.
    history.replaceState(null, "", "/signup");

    function showMessage(message) {
      messageBox.textContent = message;
      messageBox.style.display = "block";
    }

    async function loadInvite() {
      if (!inviteToken) {
        showMessage("This sign-up page requires a valid invitation link.");
        return;
      }
      try {
        const response = await fetch("/api/auth/signup-invite", {
          method: "POST",
          credentials: "same-origin",
          cache: "no-store",
          headers: {"Accept": "application/json", "Content-Type": "application/json"},
          body: JSON.stringify({invite: inviteToken})
        });
        if (!response.ok) throw new Error("invalid-invite");
        const payload = await response.json();
        emailInput.value = payload.invite.email;
        button.disabled = false;
      } catch (_) {
        showMessage("This invitation is invalid, expired, or has already been used.");
      }
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      if (!form.reportValidity() || button.disabled) return;
      const password = document.querySelector("#password").value;
      if (password !== document.querySelector("#password-confirm").value) {
        showMessage("The passwords do not match.");
        return;
      }

      messageBox.style.display = "none";
      button.disabled = true;
      button.textContent = "Creating account…";
      try {
        const response = await fetch("/api/auth/signup", {
          method: "POST",
          credentials: "same-origin",
          cache: "no-store",
          headers: {"Accept": "application/json", "Content-Type": "application/json"},
          body: JSON.stringify({
            invite: inviteToken,
            email: emailInput.value,
            displayName: document.querySelector("#display-name").value.trim(),
            password
          })
        });
        if (response.ok) {
          try { sessionStorage.setItem("eridant-fresh-upload", "1"); sessionStorage.removeItem("eridant-analysis-open"); sessionStorage.removeItem("eridant-view"); } catch (_) {}
          try {
            await new Promise((resolve, reject) => {
              const req = indexedDB.deleteDatabase("eridant-packet");
              req.onsuccess = () => resolve();
              req.onerror = () => resolve();
              req.onblocked = () => resolve();
            });
          } catch (_) {}
          window.location.replace("/");
          return;
        }
        if (response.status === 409) {
          showMessage("An account already exists for this email. Please log in.");
        } else if (response.status === 403) {
          showMessage("This invitation is invalid, expired, or has already been used.");
        } else {
          showMessage("Please check your name and password, then try again.");
        }
      } catch (_) {
        showMessage("Account creation is temporarily unavailable. Please try again.");
      } finally {
        button.disabled = false;
        button.textContent = "Create account →";
      }
    });

    loadInvite();
  </script>
</body>
</html>
