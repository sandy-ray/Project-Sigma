services:
  - type: web
    name: eridant
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /healthz
    envVars:
      - key: SIGMA_SECURE_COOKIE
        value: "true"
      - key: SIGMA_PUBLIC_ORIGIN
        sync: false
      - key: SIGMA_BOOTSTRAP_EMAIL
        sync: false
      - key: SIGMA_BOOTSTRAP_PASSWORD
        sync: false
      - key: SIGMA_BOOTSTRAP_NAME
        value: Analyst
      - key: SIGMA_BOOTSTRAP_SUPERVISOR_EMAIL
        sync: false
      - key: SIGMA_BOOTSTRAP_SUPERVISOR_PASSWORD
        sync: false
      - key: SIGMA_BOOTSTRAP_SUPERVISOR_NAME
        value: Credit Supervisor
      - key: SIGMA_PASSWORD_PEPPER
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ANTHROPIC_MODEL
        sync: false
